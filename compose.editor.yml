# NakĹ‚adka na lokalny Compose wtf_www; uruchamiana przez start-dev.bat.
services:
  wordpress:
    environment:
      KLANARCHIA_EDITOR_DEV_SERVER: http://localhost:5174
    volumes:
      - ../../../Klanarchia_edytor/plugin/klanarchia-edytor:/var/www/html/wp-content/plugins/klanarchia-edytor:ro
  editor:
    image: node:22-alpine
    working_dir: /workspace
    ports:
      - "127.0.0.1:5174:5174"
    volumes:
      - ../../../Klanarchia_edytor:/workspace
      - klanarchia-editor-node-modules:/workspace/node_modules
    command: ["sh", "-c", "npm ci && npm run dev"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5174/@vite/client').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 15s
volumes:
  klanarchia-editor-node-modules:
